# Build with Cloud Build, deploy quiz-api and quiz-web to Cloud Run (same flow as scripts/deploy-gcp.sh).
# Requires GitHub repository secrets — see .github/GCP_DEPLOY.md

name: Deploy to GCP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/deploy-gcp.sh'
      - '.github/workflows/deploy-gcp.yml'

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Run deploy script
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
          SQL_INSTANCE: ${{ secrets.SQL_INSTANCE }}
          USE_DOCKER_BUILD: "1"
          PUBLIC_API_URL: https://personal-test.ft-gateway.digitalapicraft.com
        run: bash scripts/deploy-gcp.sh

      - name: Print service URLs
        env:
          GCP_REGION: ${{ secrets.GCP_REGION }}
          PUBLIC_API_URL: https://personal-test.ft-gateway.digitalapicraft.com
        run: |
          REGION="${GCP_REGION:-us-central1}"
          API_URL="$(gcloud run services describe quiz-api --region "$REGION" --format='value(status.url)')"
          WEB_URL="$(gcloud run services describe quiz-web --region "$REGION" --format='value(status.url)')"
          echo "## Deployed" >> "$GITHUB_STEP_SUMMARY"
          PUBLIC_API_URL="${PUBLIC_API_URL:-https://personal-test.ft-gateway.digitalapicraft.com}"
          echo "- **Web:** $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Public API (browser):** $PUBLIC_API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API upstream (Cloud Run):** $API_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Docs (upstream):** $API_URL/docs" >> "$GITHUB_STEP_SUMMARY"
